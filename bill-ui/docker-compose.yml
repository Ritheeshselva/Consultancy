services:
  app:
    image: ritheesh007/bill-ui:latest
    pull_policy: always
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: production
      PORT: 5002
      CLIENT_URL: http://localhost:5002
      MONGO_URI: mongodb://mongo:27017/Selvam_Motors
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRES_IN: 8h
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
